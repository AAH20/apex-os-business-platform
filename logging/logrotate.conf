# Logrotate Configuration for APEX-OS Business Platform
# Version: 1.0
# Purpose: Automated log rotation, compression, and retention
# Install: sudo cp logrotate.conf /etc/logrotate.d/apex-os

# Global options
su root root
dateext
dateformat -%Y%m%d-%s
maxage 90
notifempty
missingok
compress
delaycompress
copytruncate
rotate 30
maxsize 500M
minsize 100M

# Application logs
/var/log/apex-os/app*.log {
  daily
  rotate 30
  size 500M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0644 apex-os apex-os
  sharedscripts
  postrotate
    # Signal application to reopen log files
    /bin/kill -HUP `cat /var/run/apex-os.pid 2>/dev/null` 2>/dev/null || true
    # Notify log aggregator of rotation
    curl -s -X POST http://localhost:8080/admin/logrotate -d "file=%n" || true
  endscript
}

# Error logs (longer retention)
/var/log/apex-os/error*.log {
  daily
  rotate 90
  size 200M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0644 apex-os apex-os
  sharedscripts
  postrotate
    /bin/kill -HUP `cat /var/run/apex-os.pid 2>/dev/null` 2>/dev/null || true
  endscript
}

# Audit logs (compliance: 7-year retention via S3 sync)
/var/log/apex-os/audit*.log {
  daily
  rotate 365
  size 100M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0600 apex-os apex-os
  sharedscripts
  postrotate
    /bin/kill -HUP `cat /var/run/apex-os.pid 2>/dev/null` 2>/dev/null || true
    # Sync to S3 for compliance
    aws s3 sync /var/log/apex-os/ s3://apex-os-audit-logs/ --exclude "*" --include "audit*.log*" || true
  endscript
}

# Nginx access logs
/var/log/nginx/apex-os-access.log {
  daily
  rotate 30
  size 500M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0644 www-data adm
  sharedscripts
  postrotate
    [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid` || true
  endscript
}

# Nginx error logs
/var/log/nginx/apex-os-error.log {
  daily
  rotate 30
  size 100M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0644 www-data adm
  sharedscripts
  postrotate
    [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid` || true
  endscript
}

# Docker container logs
/var/lib/docker/containers/*/*-json.log {
  daily
  rotate 14
  size 200M
  missingok
  notifempty
  compress
  delaycompress
  copytruncate
  dateext
  dateformat -%Y%m%d-%s
}

# Systemd journal (managed by journald, but ensure size limits)
/var/log/journal {
  daily
  rotate 7
  size 1G
  missingok
  notifempty
  compress
  delaycompress
  sharedscripts
  postrotate
    journalctl --vacuum-size=1G || true
  endscript
}

# Fluentd buffer and failed logs
/var/log/fluentd/*.log {
  daily
  rotate 14
  size 100M
  missingok
  notifempty
  compress
  delaycompress
  copytruncate
  dateext
  dateformat -%Y%m%d-%s
}

# Logstash logs
/var/log/logstash/*.log {
  daily
  rotate 30
  size 200M
  missingok
  notifempty
  compress
  delaycompress
  dateext
  dateformat -%Y%m%d-%s
  create 0644 logstash logstash
  sharedscripts
  postrotate
    [ -f /var/run/logstash.pid ] && kill -HUP `cat /var/run/logstash.pid` || true
  endscript
}

# Cleanup old compressed logs older than 90 days
/var/log/apex-os/*.gz {
  daily
  maxage 90
  missingok
  notifempty
  nocreate
}
