# Logstash Configuration for APEX-OS Business Platform
# Version: 1.0
# Purpose: Centralized log aggregation, parsing, and enrichment

input {
  beats {
    port => 5044
    host => "0.0.0.0"
    ssl => true
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key => "/etc/logstash/certs/logstash.key"
  }

  tcp {
    port => 5140
    type => "syslog"
    codec => json
  }

  udp {
    port => 5140
    type => "syslog"
    codec => json
  }

  file {
    path => "/var/log/apex-os/*.log"
    type => "application"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb"
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  if [type] == "application" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:msg}"
      }
      tag_on_failure => ["_grokparsefailure"]
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "service" => "%{fields[service]}"
        "environment" => "${APEX_ENV:production}"
        "platform" => "apex-os"
      }
      remove_field => ["timestamp", "host", "path"]
    }

    if [level] == "ERROR" or [level] == "FATAL" {
      mutate { add_tag => ["error", "alert"] }
    }
  }

  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp}\s+%{SYSLOGHOST:syslog_host}\s+%{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?:\s+%{GREEDYDATA:syslog_message}"
      }
    }
  }

  # Enrich with GeoIP for access logs
  if [fields][remote_ip] {
    geoip {
      source => "[fields][remote_ip]"
      target => "geoip"
    }
  }

  # Drop health-check noise
  if [msg] =~ /health|ping|heartbeat/ {
    drop { }
  }
}

output {
  # Primary: Elasticsearch
  elasticsearch {
    hosts => ["${ES_HOST:localhost:9200}"]
    index => "apex-os-%{+YYYY.MM.dd}"
    template => "/etc/logstash/templates/apex-os-template.json"
    template_name => "apex-os"
    template_overwrite => true
    ssl => true
    ssl_certificate_verification => true
    user => "${ES_USER:elastic}"
    password => "${ES_PASSWORD}"
  }

  # Errors go to a dedicated index for alerting
  if "error" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST:localhost:9200}"]
      index => "apex-os-errors-%{+YYYY.MM.dd}"
    }

    # Also send to Slack for real-time alerting
    http {
      url => "${SLACK_WEBHOOK_URL}"
      http_method => "post"
      content_type => "application/json"
      format => "json"
      mapping => {
        "text" => "🚨 APEX-OS Error: [%{service}] %{msg}"
      }
    }
  }

  # Archive to S3 for long-term storage
  s3 {
    region => "${AWS_REGION:us-east-1}"
    bucket => "${S3_LOG_BUCKET:apex-os-logs}"
    prefix => "%{+YYYY/MM/dd}/"
    size_file => 104857600
    time_file => 60
    codec => "json_lines"
    canned_acl => "private"
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
