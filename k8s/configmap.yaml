apiVersion: v1
kind: ConfigMap
metadata:
  name: apex-config
  namespace: apex-os
  labels:
    app: apex-os
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_PORT: "8080"
  FRONTEND_PORT: "3000"
  CORS_ORIGIN: "https://app.apex-os.example.com"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"
  REDIS_TTL: "3600"
  SESSION_TIMEOUT: "86400"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX: "100"
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
