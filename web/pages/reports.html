<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - APEX-OS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
<div class="max-w-2xl mx-auto">
<h1 class="text-2xl font-bold mb-6">Reports</h1>
<form id="crudForm" class="space-y-4" novalidate>
<div>
<label class="block text-sm font-medium mb-1">Report Name <span class="text-red-400">*</span></label>
<input type="text" name="name" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-gray-100 focus:outline-none focus:border-blue-500">
<p class="error-msg text-red-400 text-sm mt-1 hidden"></p>
</div>
<div>
<label class="block text-sm font-medium mb-1">Report Type <span class="text-red-400">*</span></label>
<select name="type" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-gray-100 focus:outline-none focus:border-blue-500">
<option value="">Select...</option>
<option value="sales">Sales</option>
<option value="inventory">Inventory</option>
<option value="financial">Financial</option>
</select>
<p class="error-msg text-red-400 text-sm mt-1 hidden"></p>
</div>
<div>
<label class="block text-sm font-medium mb-1">Start Date <span class="text-red-400">*</span></label>
<input type="date" name="start_date" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-gray-100 focus:outline-none focus:border-blue-500">
<p class="error-msg text-red-400 text-sm mt-1 hidden"></p>
</div>
<div>
<label class="block text-sm font-medium mb-1">End Date <span class="text-red-400">*</span></label>
<input type="date" name="end_date" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-gray-100 focus:outline-none focus:border-blue-500">
<p class="error-msg text-red-400 text-sm mt-1 hidden"></p>
</div>
<button type="submit" disabled class="px-4 py-2 bg-blue-600 text-white rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700">Save</button>
</form>
</div>
<script>
(function(){
const form=document.getElementById('crudForm');
const btn=form.querySelector('button[type=submit]');
function validateField(field){
const err=field.parentElement.querySelector('.error-msg');
const val=field.value.trim();
let msg='';
if(field.required&&!val){msg='This field is required.';}
if(msg){err.textContent=msg;err.classList.remove('hidden');field.classList.add('border-red-500');}
else{err.classList.add('hidden');field.classList.remove('border-red-500');}
return!msg;
}
function validateAll(){
let valid=true;
form.querySelectorAll('input,select,textarea').forEach(f=>{if(!validateField(f))valid=false;});
btn.disabled=!valid;
return valid;
}
form.querySelectorAll('input,select,textarea').forEach(f=>{
f.addEventListener('input',()=>{validateField(f);validateAll();});
f.addEventListener('blur',()=>{validateField(f);validateAll();});
});
form.addEventListener('submit',e=>{e.preventDefault();if(validateAll()){form.reset();}});
validateAll();
})();
</script>
</body>
</html>
