<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - APEX-OS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { margin-bottom: 20px; color: #fff; }
.bulk-bar { display: none; align-items: center; gap: 16px; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 12px 20px; margin-bottom: 16px; }
.bulk-bar.visible { display: flex; }
.bulk-bar .selected-count { color: #e94560; font-weight: 600; }
.bulk-bar button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.bulk-bar .btn-delete { background: #e94560; color: #fff; }
.bulk-bar .btn-delete:hover { background: #c73e54; }
.bulk-bar .btn-export { background: #0f3460; color: #fff; border: 1px solid #1a5276; }
.bulk-bar .btn-export:hover { background: #1a5276; }
table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 8px; overflow: hidden; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #0f3460; }
th { background: #0f3460; color: #fff; font-weight: 600; }
th input[type="checkbox"], td input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #e94560; }
tr:hover { background: #1a1a3e; }
</style>
</head>
<body>
<div class="container">
<h1>Users</h1>
<div class="bulk-bar" id="bulkBar">
<span class="selected-count" id="selectedCount">0 selected</span>
<button class="btn-delete" onclick="bulkDelete()">Delete</button>
<button class="btn-export" onclick="bulkExport()">Export</button>
</div>
<table>
<thead><tr>
<th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
<th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th>
</tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<script>
const data = [
{id:1,name:'Alice Johnson',email:'alice@example.com',role:'Admin',status:'Active'},
{id:2,name:'Bob Smith',email:'bob@example.com',role:'Editor',status:'Active'},
{id:3,name:'Carol White',email:'carol@example.com',role:'Viewer',status:'Inactive'},
{id:4,name:'David Brown',email:'david@example.com',role:'Editor',status:'Active'},
{id:5,name:'Eve Davis',email:'eve@example.com',role:'Viewer',status:'Active'}
];
const tbody = document.getElementById('tableBody');
data.forEach(row => {
const tr = document.createElement('tr');
tr.innerHTML = `<td><input type="checkbox" class="row-check" value="${row.id}" onchange="updateBulkBar()"></td><td>${row.id}</td><td>${row.name}</td><td>${row.email}</td><td>${row.role}</td><td>${row.status}</td>`;
tbody.appendChild(tr);
});
function toggleSelectAll() {
const checked = document.getElementById('selectAll').checked;
document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
updateBulkBar();
}
function updateBulkBar() {
const count = document.querySelectorAll('.row-check:checked').length;
document.getElementById('selectedCount').textContent = count + ' selected';
document.getElementById('bulkBar').classList.toggle('visible', count > 0);
}
function bulkDelete() {
const selected = [...document.querySelectorAll('.row-check:checked')].map(cb => cb.value);
if(confirm('Delete ' + selected.length + ' selected item(s)?')) {
selected.forEach(id => {
const row = document.querySelector(`.row-check[value="${id}"]`).closest('tr');
row.remove();
});
updateBulkBar();
}
}
function bulkExport() {
const selected = [...document.querySelectorAll('.row-check:checked')].map(cb => cb.value);
const rows = data.filter(r => selected.includes(String(r.id)));
const csv = 'ID,Name,Email,Role,Status\n' + rows.map(r => `${r.id},"${r.name}","${r.email}","${r.role}","${r.status}"`).join('\n');
const blob = new Blob([csv], {type:'text/csv'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'users_export.csv';
a.click();
}
</script>
</body>
</html>
