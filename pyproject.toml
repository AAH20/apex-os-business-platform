[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-os-business-platform"
version = "0.1.0"
description = "APEX-OS Business Platform — Unified business operations platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Ahmed Hassan", email = "aah@a2zsoc.com"},
]
keywords = ["business", "accounting", "crm", "erp", "analytics", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0",
    "sqlalchemy>=2.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "alembic>=1.13.0",
    "pandas>=2.0",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
    "psutil>=5.9.0",
    "scipy>=1.11.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/AAH20/apex-os-business-platform"
Repository = "https://github.com/AAH20/apex-os-business-platform"
Issues = "https://github.com/AAH20/apex-os-business-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "web/backend"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
