apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apex-os.fullname" . }}-secrets
  labels:
    {{- include "apex-os.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc | quote }}
