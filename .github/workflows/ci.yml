name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref instead of queueing them. Two rapid
# pushes previously left the earlier run's 3.11/3.12 matrix legs "cancelled",
# which GitHub reports as a failed run even though no step ever failed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE ON RUNNER STARVATION (observed 2026-10-05):
  # Four consecutive runs were cancelled at exactly the timeout boundary with
  # runner_name empty and zero steps executed - the jobs never received a
  # GitHub-hosted runner. This is account-level runner capacity, not a
  # workflow defect, and no workflow change can fix it. Mitigations here:
  #   - fewer, heavier jobs (matrix 3.10/3.11/3.12 -> 3.11/3.12) so the whole
  #     workflow needs 3 runners instead of 5
  #   - a short job timeout, because a job still waiting for a runner at the
  #     timeout is cancelled and yields no diagnostic output at all
  test:
    runs-on: ubuntu-latest
    # The full suite takes ~10min on GitHub runners (measured 9m41s); keep headroom
    # so a slow runner isn't cancelled mid-suite (which reads as a bare 'cancelled'
    # with no diagnosis).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicit list rather than `pip install -e .`. The suite imports
          # alembic, botocore, playwright and scipy directly, and pytest cannot
          # even COLLECT a module whose imports are missing - an incomplete
          # dependency list is indistinguishable from a broken test suite.
          #
          # playwright is the Python package only; the browser binaries are not
          # installed and the e2e/browser tests skip themselves when it is
          # absent, so CI stays fast while collection succeeds.
          pip install pytest pytest-asyncio pytest-cov
          pip install fastapi uvicorn "pydantic>=2" httpx python-multipart \
                      email-validator sqlalchemy alembic PyYAML numpy pandas \
                      beautifulsoup4 pyjwt boto3 psutil scipy pillow playwright \
                      scikit-learn aioredis azure-storage-blob requests \
                      google-cloud-storage statsmodels pytest-playwright setuptools

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Install Playwright browser (for SPA/browser tests)
        run: |
          # The e2e/accessibility suites drive a real headless Chromium
          # against the in-process SPA server (~4 min of tests). Without
          # this step every browser-dependent test errors with
          # 'BrowserType.launch: Executable doesn't exist'.
          playwright install chromium
          playwright install-deps chromium || true  # OS libs; best effort, apt may already have them

      - name: Build React SPA (served by the in-process test server)
        run: |
          # tests/test_crud_accessibility.py mounts web/frontend/dist onto
          # the backend and asserts on the REAL rendered UI (landmarks,
          # labels, contrast). Without a build, dist/ is absent and every
          # assertion sees a blank page.
          cd web/frontend
          npm ci
          npm run build

      - name: Run test suite
        run: python -m pytest tests/ -q --maxfail=25

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  backend-imports:
    # Guards the concrete regressions fixed in this session: the web/backend app
    # must stay importable and its route inventory must not silently shrink.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn "pydantic>=2" httpx python-multipart \
                      email-validator sqlalchemy PyYAML

      - name: Web backend must import
        run: |
          cd web/backend
          python -c "import main; print('web.backend OK:', len(main.app.routes), 'routes')"

      - name: Route inventory is intact
        run: |
          cd web/backend
          python - <<'PY'
          import main

          spec = main.app.openapi()
          paths = set(spec.get("paths", {}))

          # Assert on prefixes rather than exact paths: routers mix trailing
          # slash conventions, so "/api/users" and "/api/users/" are both valid.
          # Requiring the collection prefix keeps this stable either way.
          required = [
              "users", "products", "leads", "notifications", "assets",
              "integrations", "iot", "agents", "accounts", "journal-entries",
          ]
          found = {p for p in paths}
          missing = [
              name for name in required
              if not any(p == f"/api/{name}" or p.startswith(f"/api/{name}/")
                         or p == f"/api/{name}/" for p in found)
          ]
          assert not missing, f"missing route collections: {missing}"
          print(f"route inventory OK ({len(paths)} documented paths)")
          PY
