apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apex-api-monitor
  namespace: monitoring
  labels:
    app: apex-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: apex-api
  namespaceSelector:
    matchNames:
      - apex-os
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          target_label: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          target_label: namespace
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apex-worker-monitor
  namespace: monitoring
  labels:
    app: apex-worker
    release: prometheus
spec:
  selector:
    matchLabels:
      app: apex-worker
  namespaceSelector:
    matchNames:
      - apex-os
  endpoints:
    - port: http
      path: /metrics
